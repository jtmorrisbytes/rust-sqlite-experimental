


[package]
name = "sqlite"
version = "0.1.0"
edition = "2024"


[lib]

[dependencies]
dashmap = "6.2.1"
fs4 = "1.1.0"
libc = "0.2.186"

[build-dependencies]
cc = "1.2.62"

# we are promising not to panic,
# as this will abort the program
[profile.release]
panic="abort"


[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "mem_sqlite3vec_partialeq"
harness = false # D

[[bench]]
name = "varint_benchmarks"
harness = false # D



[target.'cfg(target_os="windows")'.dependencies.windows-sys]
version = "0.61.0"
features=["Win32_Foundation","Win32_System_IO","Win32_Storage_FileSystem","Win32_System_Memory"]
